AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Workverse Mail - standalone minimal email marketing stack

Parameters:
  SesFromEmail:
    Type: String
    Description: Verified SES sender email address
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 20
    Description: Secret CloudFront sends to the API; keep private

Resources:
  MailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: workverse-mail-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      InlineCode: |
        import json, os, re, uuid
        from datetime import datetime, timezone
        import boto3
        from botocore.exceptions import ClientError

        ddb = boto3.resource('dynamodb').Table(os.environ['TABLE_NAME'])
        ses = boto3.client('sesv2')
        SECRET = os.environ['ORIGIN_SECRET']
        FROM = os.environ['SES_FROM_EMAIL']
        EMAIL_RE = re.compile(r'^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$')

        def response(status, body):
            return {'statusCode': status, 'headers': {'Content-Type':'application/json'}, 'body': json.dumps(body)}

        def authorized(event):
            headers = {str(k).lower(): str(v) for k,v in (event.get('headers') or {}).items()}
            return headers.get('x-workverse-mail-origin') == SECRET

        def handler(event, context):
            if not authorized(event):
                return response(403, {'message':'Forbidden'})
            method = event.get('requestContext',{}).get('http',{}).get('method','GET')
            path = event.get('rawPath','')
            if method == 'POST' and path.endswith('/api/send'):
                return send(event)
            if method == 'GET' and re.search(r'/api/emails/[^/]+$', path):
                return get_campaign(event)
            if method == 'GET' and path.endswith('/api/emails'):
                return list_campaigns()
            return response(404, {'message':'Not found'})

        def send(event):
            try:
                data = json.loads(event.get('body') or '{}')
                recipients = list(dict.fromkeys([x.strip().lower() for x in data.get('recipients',[]) if isinstance(x,str) and EMAIL_RE.match(x.strip())]))
                subject = str(data.get('subject','')).strip()
                body = str(data.get('body',''))
                if not recipients or len(recipients) > 100 or not subject or not body:
                    return response(400, {'message':'Provide 1-100 valid recipients, a subject and body.'})
                campaign_id = str(uuid.uuid4())
                sent_at = datetime.now(timezone.utc).isoformat()
                # Send separately so recipient addresses are never exposed to each other.
                for email in recipients:
                    ses.send_email(
                        FromEmailAddress=FROM,
                        Destination={'ToAddresses':[email]},
                        Content={'Simple': {'Subject': {'Data':subject, 'Charset':'UTF-8'}, 'Body': {'Text': {'Data':body, 'Charset':'UTF-8'}}}}
                    )
                    ddb.put_item(Item={'pk':'CAMPAIGN#'+campaign_id,'sk':'RECIPIENT#'+email,'email':email,'subject':subject,'body':body,'sentAt':sent_at})
                ddb.put_item(Item={'pk':'CAMPAIGN#'+campaign_id,'sk':'META','campaignId':campaign_id,'subject':subject,'body':body,'recipientCount':len(recipients),'recipients':recipients,'sentAt':sent_at})
                return response(200, {'campaignId':campaign_id,'recipientCount':len(recipients)})
            except ClientError as e:
                msg = e.response.get('Error',{}).get('Message','SES error')
                return response(502, {'message':msg})
            except Exception as e:
                return response(500, {'message':str(e)})

        def list_campaigns():
            # Simple scan is fine for this small MVP. Add a GSI later if history grows significantly.
            out = ddb.scan(FilterExpression='sk = :meta', ExpressionAttributeValues={':meta':'META'}, Limit=50)
            items = sorted(out.get('Items',[]), key=lambda x:x.get('sentAt',''), reverse=True)
            return response(200, {'items':items[:20]})

        def get_campaign(event):
            cid = event.get('rawPath','').rstrip('/').split('/')[-1]
            out = ddb.get_item(Key={'pk':'CAMPAIGN#'+cid,'sk':'META'})
            item = out.get('Item')
            if not item: return response(404, {'message':'Campaign not found'})
            return response(200, item)
      Environment:
        Variables:
          TABLE_NAME: !Ref MailTable
          SES_FROM_EMAIL: !Ref SesFromEmail
          ORIGIN_SECRET: !Ref OriginSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MailTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  MailApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST

  SendRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MailApi
      RouteKey: 'POST /api/send'
      Target: !Sub integrations/${MailIntegration}

  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MailApi
      RouteKey: 'GET /api/emails'
      Target: !Sub integrations/${MailIntegration}

  DetailRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MailApi
      RouteKey: 'GET /api/emails/{campaignId}'
      Target: !Sub integrations/${MailIntegration}

  MailIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MailApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MailFunction.Arn
      PayloadFormatVersion: '2.0'

  MailFunctionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${MailApi}/*

  MailDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt MailBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref MailOAC
          - Id: ApiOrigin
            DomainName: !Select [2, !Split ['/', !GetAtt MailApi.ApiEndpoint]]
            OriginPath: /prod
            CustomHeaders:
              - HeaderName: X-Workverse-Mail-Origin
                HeaderValue: !Ref OriginSecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiCacheDisabledPolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true


  ApiCacheDisabledPolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: workverse-mail-api-no-cache
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  MailOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: workverse-mail-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${MailBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MailDistribution}

Outputs:
  FrontendBucket:
    Value: !Ref MailBucket
  CloudFrontUrl:
    Value: !Sub https://${MailDistribution.DomainName}
  CloudFrontDistributionId:
    Value: !Ref MailDistribution
  ApiEndpoint:
    Value: !GetAtt MailApi.ApiEndpoint
  DynamoTable:
    Value: !Ref MailTable
