AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Standalone Workverse Mail application

Parameters:
  SesFromEmail:
    Type: String
    Default: marketing@workverse.me
    Description: Verified SES sender email address

Resources:

  MailUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: workverse-mail-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

  MailUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref MailUserPool
      ClientName: workverse-mail-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  MailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: workverse-mail-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MailApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub
                - "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
                - UserPoolId: !Ref MailUserPool
              audience:
                - !Ref MailUserPoolClient

  MailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: workverse-mail-function
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref MailTable
          SES_FROM_EMAIL: !Ref SesFromEmail
          MAIL_BUCKET: !Ref MailBucket
          CAMPAIGN_PREFIX: campaigns/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MailTable
        - S3CrudPolicy:
            BucketName: !Ref MailBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - ses:GetSendQuota
              Resource: "*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:workverse-mail-function"
      InlineCode: |
        import base64
        import decimal
        import hashlib
        import json
        import os
        import re
        import time
        import uuid
        from datetime import datetime, timezone
        from email.mime.multipart import MIMEMultipart
        from email.mime.text import MIMEText
        from email.mime.base import MIMEBase
        from email import encoders

        import boto3
        from botocore.exceptions import ClientError

        dynamodb = boto3.resource("dynamodb")
        table = dynamodb.Table(os.environ["TABLE_NAME"])
        ses = boto3.client("ses")
        s3 = boto3.client("s3")
        lambda_client = boto3.client("lambda")
        FROM_EMAIL = os.environ["SES_FROM_EMAIL"]
        MAIL_BUCKET = os.environ["MAIL_BUCKET"]
        CAMPAIGN_PREFIX = os.environ.get("CAMPAIGN_PREFIX", "campaigns/")

        EMAIL_RE = re.compile(r"^[^\s@]+@[^\s@]+\.[^\s@]+$")
        WORKER_BATCH_SIZE = 10

        class DecimalEncoder(json.JSONEncoder):
            def default(self, obj):
                if isinstance(obj, decimal.Decimal):
                    return float(obj)
                return super().default(obj)

        def response(status_code, body):
            return {
                "statusCode": status_code,
                "headers": {"Content-Type": "application/json", "Cache-Control": "no-store"},
                "body": json.dumps(body, cls=DecimalEncoder)
            }

        def parse_body(event):
            body = event.get("body") or "{}"
            if event.get("isBase64Encoded"):
                body = base64.b64decode(body).decode("utf-8")
            return json.loads(body)

        def now():
            return datetime.now(timezone.utc).isoformat()

        def recipient_key(email):
            digest = hashlib.sha256(email.encode("utf-8")).hexdigest()
            return "RECIPIENT#" + digest

        def campaign_key(campaign_id):
            return "CAMPAIGN#" + campaign_id

        def load_payload(campaign_id):
            obj = s3.get_object(Bucket=MAIL_BUCKET, Key=f"{CAMPAIGN_PREFIX}{campaign_id}/payload.json")
            return json.loads(obj["Body"].read().decode("utf-8"))

        def store_payload(campaign_id, payload):
            data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
            s3.put_object(
                Bucket=MAIL_BUCKET,
                Key=f"{CAMPAIGN_PREFIX}{campaign_id}/payload.json",
                Body=data,
                ContentType="application/json",
                ServerSideEncryption="AES256"
            )

        def update_campaign_summary(campaign_id, status=None, **values):
            meta = table.get_item(Key={"pk": campaign_key(campaign_id), "sk": "META"}).get("Item")
            if not meta:
                return
            updates = []
            names = {}
            expr_values = {}
            for field, value in values.items():
                safe = "#" + field
                updates.append(f"{safe} = :{field}")
                names[safe] = field
                expr_values[":" + field] = value
            if status is not None:
                updates.append("#status = :status")
                names["#status"] = "status"
                expr_values[":status"] = status
            if not updates:
                return
            table.update_item(
                Key={"pk": campaign_key(campaign_id), "sk": "META"},
                UpdateExpression="SET " + ", ".join(updates),
                ExpressionAttributeNames=names,
                ExpressionAttributeValues=expr_values
            )
            sent_at = meta.get("sentAt", "")
            if sent_at:
                table.update_item(
                    Key={"pk": "CAMPAIGNS", "sk": sent_at + "#" + campaign_id},
                    UpdateExpression="SET " + ", ".join(updates),
                    ExpressionAttributeNames=names,
                    ExpressionAttributeValues=expr_values
                )

        def create_campaign(event):
            try:
                data = parse_body(event)
                subject = str(data.get("subject", "")).strip()
                body_html = str(data.get("body", ""))
                attachments = data.get("attachments", [])
                if not subject:
                    return response(400, {"message": "Subject is required."})
                if not body_html.strip():
                    return response(400, {"message": "Email body is required."})
                if not isinstance(attachments, list):
                    attachments = []

                campaign_id = str(uuid.uuid4())
                sent_at = now()
                campaign = {
                    "campaignId": campaign_id,
                    "subject": subject,
                    "body": body_html,
                    "recipientCount": 0,
                    "successful": 0,
                    "failed": 0,
                    "invalid": 0,
                    "sentAt": sent_at,
                    "status": "QUEUED"
                }
                store_payload(campaign_id, {"subject": subject, "body": body_html, "attachments": attachments})
                table.put_item(Item={"pk": "CAMPAIGNS", "sk": sent_at + "#" + campaign_id, **campaign})
                table.put_item(Item={"pk": campaign_key(campaign_id), "sk": "META", **campaign})
                return response(201, campaign)
            except Exception as error:
                return response(500, {"message": str(error)})

        def add_recipients(campaign_id, event):
            try:
                meta = table.get_item(Key={"pk": campaign_key(campaign_id), "sk": "META"}).get("Item")
                if not meta:
                    return response(404, {"message": "Campaign not found"})
                if meta.get("status") not in ("QUEUED",):
                    return response(409, {"message": "Recipients can only be added before the campaign starts."})

                data = parse_body(event)
                raw = data.get("recipients", [])
                if not isinstance(raw, list):
                    return response(400, {"message": "Recipients must be a list."})

                recipients = []
                invalid = []
                for value in raw:
                    email = ""
                    name = ""
                    if isinstance(value, dict):
                        email = value.get("email", "").strip().lower()
                        name = value.get("name", "")
                    elif isinstance(value, str):
                        email = value.strip().lower()
                        name = ""
                    else:
                        continue
                    if EMAIL_RE.fullmatch(email):
                        recipients.append({"email": email, "name": name})
                    elif email:
                        invalid.append(email)

                added = 0
                with table.batch_writer() as batch:
                    for r in recipients:
                        batch.put_item(Item={
                            "pk": campaign_key(campaign_id),
                            "sk": recipient_key(r["email"]),
                            "email": r["email"],
                            "name": r["name"],
                            "status": "PENDING"
                        })
                        added += 1

                current = meta.get("recipientCount", 0)
                new_total = current + added
                update_campaign_summary(campaign_id, recipientCount=new_total, invalid=meta.get("invalid", 0) + len(invalid))
                return response(200, {"campaignId": campaign_id, "added": added, "invalid": len(invalid), "recipientCount": new_total})
            except Exception as error:
                return response(500, {"message": str(error)})

        def start_campaign(campaign_id):
            try:
                meta = table.get_item(Key={"pk": campaign_key(campaign_id), "sk": "META"}).get("Item")
                if not meta:
                    return response(404, {"message": "Campaign not found"})
                if meta.get("status") != "QUEUED":
                    return response(409, {"message": "Campaign already started or finished."})
                if meta.get("recipientCount", 0) == 0:
                    return response(400, {"message": "No recipients added."})

                update_campaign_summary(campaign_id, status="SENDING", startedAt=now())
                lambda_client.invoke(
                    FunctionName=os.environ["AWS_LAMBDA_FUNCTION_NAME"],
                    InvocationType="Event",
                    Payload=json.dumps({"action": "process_campaign", "campaignId": campaign_id})
                )
                return response(200, {"campaignId": campaign_id, "status": "SENDING"})
            except Exception as error:
                return response(500, {"message": str(error)})

        def build_message(email, name, payload):
            subject = payload["subject"]
            body_html = payload["body"]
            attachments = payload.get("attachments", [])
            personalized_html = body_html.replace("{{Name}}", name).replace("{{Email}}", email)
            personalized_plain = re.sub(r"<[^>]+>", "", personalized_html)

            # Root must be mixed so clients recognise regular file attachments
            msg = MIMEMultipart("mixed")
            msg["Subject"] = subject
            msg["From"] = FROM_EMAIL
            msg["To"] = email

            # Related container holds the HTML body and inline images
            msg_related = MIMEMultipart("related")
            msg.attach(msg_related)

            msg_alt = MIMEMultipart("alternative")
            msg_related.attach(msg_alt)

            msg_alt.attach(MIMEText(personalized_plain, "plain", "utf-8"))
            msg_alt.attach(MIMEText(personalized_html, "html", "utf-8"))

            for att in attachments:
                cid = att.get("cid", "")
                filename = att.get("filename", "")
                att_data = att.get("data", "")
                content_type = att.get("contentType", "application/octet-stream")
                if not att_data:
                    continue
                main_type, sub_type = content_type.split("/", 1) if "/" in content_type else ("application", "octet-stream")
                mime_base = MIMEBase(main_type, sub_type)
                mime_base.set_payload(base64.b64decode(att_data))
                encoders.encode_base64(mime_base)

                if cid:
                    # Inline image – belongs inside the related part
                    mime_base.add_header("Content-ID", f"<{cid}>")
                    mime_base.add_header("Content-Disposition", "inline", filename=cid)
                    msg_related.attach(mime_base)
                elif filename:
                    # Regular file attachment – belongs at the mixed root
                    mime_base.add_header("Content-Disposition", "attachment", filename=filename)
                    msg.attach(mime_base)

            return {"Data": msg.as_string()}

        def send_one(recipient, payload, rate):
            email = recipient["email"]
            name = recipient.get("name", "")
            raw_message = build_message(email, name, payload)
            delay = 0.0
            for attempt in range(4):
                if delay:
                    time.sleep(delay)
                try:
                    result = ses.send_raw_email(Source=FROM_EMAIL, Destinations=[email], RawMessage=raw_message)
                    return True, result.get("MessageId", ""), ""
                except ClientError as error:
                    code = error.response.get("Error", {}).get("Code", "")
                    message = error.response.get("Error", {}).get("Message", "SES error")
                    if code in ("Throttling", "ThrottlingException", "TooManyRequestsException") and attempt < 3:
                        delay = max(1.0 / max(rate, 0.1), 1.0) * (2 ** attempt)
                        continue
                    return False, "", message
            return False, "", "SES send failed"

        def process_campaign(campaign_id, last_key=None):
            campaign_result = table.get_item(Key={"pk": campaign_key(campaign_id), "sk": "META"})
            campaign = campaign_result.get("Item")
            if not campaign or campaign.get("status") not in ("SENDING", "QUEUED"):
                return

            if campaign.get("status") == "QUEUED":
                update_campaign_summary(campaign_id, status="SENDING", startedAt=now())

            payload = load_payload(campaign_id)
            try:
                quota = ses.get_send_quota()
                rate = float(quota.get("MaxSendRate", 1.0) or 1.0)
            except Exception:
                rate = 1.0

            query = {
                "KeyConditionExpression": "pk = :pk",
                "ExpressionAttributeValues": {":pk": campaign_key(campaign_id)},
                "Limit": WORKER_BATCH_SIZE
            }
            if last_key:
                query["ExclusiveStartKey"] = last_key

            result = table.query(**query)
            items = result.get("Items", [])
            next_key = result.get("LastEvaluatedKey")

            successful = 0
            failed = 0
            for item in items:
                if item.get("sk") == "META" or item.get("status") != "PENDING":
                    continue
                ok, message_id, error_msg = send_one({"email": item["email"], "name": item.get("name", "")}, payload, rate)
                if ok:
                    table.update_item(
                        Key={"pk": item["pk"], "sk": item["sk"]},
                        UpdateExpression="SET #status = :status, messageId = :mid, sentAt = :sent",
                        ExpressionAttributeNames={"#status": "status"},
                        ExpressionAttributeValues={":status": "SENT", ":mid": message_id, ":sent": now()}
                    )
                    successful += 1
                else:
                    table.update_item(
                        Key={"pk": item["pk"], "sk": item["sk"]},
                        UpdateExpression="SET #status = :status, errorMessage = :err, sentAt = :sent",
                        ExpressionAttributeNames={"#status": "status"},
                        ExpressionAttributeValues={":status": "FAILED", ":err": error_msg, ":sent": now()}
                    )
                    failed += 1

            meta = table.get_item(Key={"pk": campaign_key(campaign_id), "sk": "META"}).get("Item", {})
            new_successful = meta.get("successful", 0) + successful
            new_failed = meta.get("failed", 0) + failed
            total = meta.get("recipientCount", 0)

            if next_key and new_successful + new_failed < total:
                update_campaign_summary(campaign_id, successful=new_successful, failed=new_failed)
                lambda_client.invoke(
                    FunctionName=os.environ["AWS_LAMBDA_FUNCTION_NAME"],
                    InvocationType="Event",
                    Payload=json.dumps({"action": "process_campaign", "campaignId": campaign_id, "lastKey": next_key})
                )
            else:
                status = "SENT" if new_failed == 0 else "FAILED" if new_successful == 0 else "PARTIAL"
                update_campaign_summary(campaign_id, status=status, successful=new_successful, failed=new_failed, finishedAt=now())

        def list_campaigns():
            result = table.query(KeyConditionExpression="pk = :pk", ExpressionAttributeValues={":pk": "CAMPAIGNS"}, ScanIndexForward=False, Limit=20)
            return response(200, {"items": result.get("Items", [])})

        def get_campaign(campaign_id):
            campaign_result = table.get_item(Key={"pk": campaign_key(campaign_id), "sk": "META"})
            campaign = campaign_result.get("Item")
            if not campaign:
                return response(404, {"message": "Campaign not found"})
            recipients_result = table.query(KeyConditionExpression="pk = :pk", ExpressionAttributeValues={":pk": campaign_key(campaign_id)})
            recipients = [item for item in recipients_result.get("Items", []) if item.get("sk", "") != "META"]
            return response(200, {"campaign": campaign, "recipients": recipients})

        def handler(event, context):
            request_context = event.get("requestContext", {})
            http = request_context.get("http", {})
            method = http.get("method", "")
            path = event.get("rawPath", "")

            # Internal async worker invocation
            if event.get("action") == "process_campaign":
                process_campaign(event.get("campaignId"), event.get("lastKey"))
                return {"statusCode": 200, "body": "ok"}

            if method == "POST" and path.endswith("/api/campaigns"):
                return create_campaign(event)
            match = re.search(r"/api/campaigns/([^/]+)/recipients$", path)
            if method == "POST" and match:
                return add_recipients(match.group(1), event)
            match = re.search(r"/api/campaigns/([^/]+)/start$", path)
            if method == "POST" and match:
                return start_campaign(match.group(1))
            if method == "GET" and path.endswith("/api/emails"):
                return list_campaigns()
            match = re.search(r"/api/emails/([^/]+)$", path)
            if method == "GET" and match:
                return get_campaign(match.group(1))
            return response(404, {"message": "Not found"})

      Events:
        SendEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/campaigns
            Method: POST
        AddRecipients:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/campaigns/{campaignId}/recipients
            Method: POST
        StartCampaign:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/campaigns/{campaignId}/start
            Method: POST
        ListEmails:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/emails
            Method: GET
        GetEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/emails/{campaignId}
            Method: GET

  MailOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: workverse-mail-oac
        Description: CloudFront access to private Workverse Mail S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MailDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt MailBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref MailOAC
          - Id: ApiOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt MailApi.ApiEndpoint]]
            OriginPath: /prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, POST, PUT, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MailBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MailDistribution}"

Outputs:
  FrontendBucket:
    Description: Private S3 bucket containing the frontend
    Value: !Ref MailBucket
  CloudFrontUrl:
    Description: HTTPS URL for Workverse Mail
    Value: !Sub "https://${MailDistribution.DomainName}"
  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref MailDistribution
  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !GetAtt MailApi.ApiEndpoint
  DynamoTable:
    Description: Dedicated DynamoDB table
    Value: !Ref MailTable
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref MailUserPool
  UserPoolClientId:
    Description: Cognito browser App Client ID
    Value: !Ref MailUserPoolClient
  CognitoIssuer:
    Description: Cognito JWT issuer
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${MailUserPool}"
