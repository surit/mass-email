AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Standalone Workverse Mail - S3, CloudFront, Cognito, API Gateway, Lambda, SES and DynamoDB

Parameters:
  SesFromEmail:
    Type: String
    Default: marketing@workverse.me
    Description: Verified SES sender address

Resources:

  # ------------------------------------------------------------
  # Cognito authentication
  # ------------------------------------------------------------

  MailUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: workverse-mail-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        UnusedAccountValidityDays: 7
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

  MailUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref MailUserPool
      ClientName: workverse-mail-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ------------------------------------------------------------
  # Dedicated DynamoDB table
  # ------------------------------------------------------------

  MailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: workverse-mail-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ------------------------------------------------------------
  # Private S3 frontend bucket
  # ------------------------------------------------------------

  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ------------------------------------------------------------
  # HTTP API with Cognito JWT authorizer
  # ------------------------------------------------------------

  MailApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource:
              - $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${MailUserPool}
              audience:
                - !Ref MailUserPoolClient

  # ------------------------------------------------------------
  # Lambda
  # ------------------------------------------------------------

  MailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256

      InlineCode: |
        import base64
        import json
        import os
        import re
        import uuid
        from datetime import datetime, timezone

        import boto3
        from botocore.exceptions import ClientError

        table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
        ses = boto3.client("sesv2")
        FROM = os.environ["SES_FROM_EMAIL"]

        EMAIL_RE = re.compile(r"^[^\s@]+@[^\s@]+\.[^\s@]+$")

        def response(status, body):
            return {
                "statusCode": status,
                "headers": {
                    "Content-Type": "application/json"
                },
                "body": json.dumps(body)
            }

        def parse_body(event):
            body = event.get("body") or "{}"
            if event.get("isBase64Encoded"):
                body = base64.b64decode(body).decode("utf-8")
            return json.loads(body)

        def handler(event, context):
            method = (
                event.get("requestContext", {})
                .get("http", {})
                .get("method", "")
            )
            path = event.get("rawPath", "")

            if method == "POST" and path.endswith("/api/send"):
                return send_email(event)

            if method == "GET" and path.endswith("/api/emails"):
                return list_campaigns()

            match = re.search(r"/api/emails/([^/]+)$", path)
            if method == "GET" and match:
                return get_campaign(match.group(1))

            return response(404, {"message": "Not found"})

        def send_email(event):
            try:
                data = parse_body(event)

                raw_recipients = data.get("recipients", [])
                if not isinstance(raw_recipients, list):
                    return response(400, {"message": "Recipients must be a list."})

                recipients = []
                invalid = []

                for value in raw_recipients:
                    if not isinstance(value, str):
                        continue
                    email = value.strip().lower()
                    if EMAIL_RE.fullmatch(email):
                        recipients.append(email)
                    elif email:
                        invalid.append(email)

                recipients = list(dict.fromkeys(recipients))

                subject = str(data.get("subject", "")).strip()
                body = str(data.get("body", ""))

                if not recipients:
                    return response(400, {"message": "At least one valid recipient is required."})

                if len(recipients) > 100:
                    return response(400, {"message": "A maximum of 100 recipients is allowed per send."})

                if not subject:
                    return response(400, {"message": "Subject is required."})

                if not body.strip():
                    return response(400, {"message": "Email body is required."})

                campaign_id = str(uuid.uuid4())
                sent_at = datetime.now(timezone.utc).isoformat()
                successful = 0
                failed = []

                for email in recipients:
                    try:
                        result = ses.send_email(
                            FromEmailAddress=FROM,
                            Destination={"ToAddresses": [email]},
                            Content={
                                "Simple": {
                                    "Subject": {
                                        "Data": subject,
                                        "Charset": "UTF-8"
                                    },
                                    "Body": {
                                        "Text": {
                                            "Data": body,
                                            "Charset": "UTF-8"
                                        }
                                    }
                                }
                            }
                        )

                        table.put_item(
                            Item={
                                "pk": "CAMPAIGN#" + campaign_id,
                                "sk": "RECIPIENT#" + email,
                                "campaignId": campaign_id,
                                "email": email,
                                "subject": subject,
                                "sentAt": sent_at,
                                "status": "SENT",
                                "messageId": result.get("MessageId", "")
                            }
                        )
                        successful += 1

                    except ClientError as error:
                        failed.append({
                            "email": email,
                            "message": error.response.get("Error", {}).get(
                                "Message", "SES error"
                            )
                        })

                status = "SENT" if not failed else (
                    "FAILED" if successful == 0 else "PARTIAL"
                )

                campaign_item = {
                    "campaignId": campaign_id,
                    "subject": subject,
                    "body": body,
                    "recipientCount": len(recipients),
                    "successful": successful,
                    "failed": len(failed),
                    "invalid": len(invalid),
                    "sentAt": sent_at,
                    "status": status
                }

                table.put_item(
                    Item={
                        "pk": "CAMPAIGNS",
                        "sk": sent_at + "#" + campaign_id,
                        **campaign_item
                    }
                )

                table.put_item(
                    Item={
                        "pk": "CAMPAIGN#" + campaign_id,
                        "sk": "META",
                        **campaign_item
                    }
                )

                return response(200, {
                    "campaignId": campaign_id,
                    "recipientCount": len(recipients),
                    "successful": successful,
                    "failed": failed,
                    "invalid": invalid,
                    "status": status
                })

            except Exception as error:
                return response(500, {"message": str(error)})

        def list_campaigns():
            result = table.query(
                KeyConditionExpression="pk = :pk",
                ExpressionAttributeValues={":pk": "CAMPAIGNS"},
                ScanIndexForward=False,
                Limit=20
            )
            return response(200, {"items": result.get("Items", [])})

        def get_campaign(campaign_id):
            meta = table.get_item(
                Key={
                    "pk": "CAMPAIGN#" + campaign_id,
                    "sk": "META"
                }
            )

            if "Item" not in meta:
                return response(404, {"message": "Campaign not found"})

            campaign = meta["Item"]

            recipients = table.query(
                KeyConditionExpression="pk = :pk",
                ExpressionAttributeValues={
                    ":pk": "CAMPAIGN#" + campaign_id
                }
            )

            return response(200, {
                "campaign": campaign,
                "recipients": recipients.get("Items", [])
            })

      Environment:
        Variables:
          TABLE_NAME: !Ref MailTable
          SES_FROM_EMAIL: !Ref SesFromEmail

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MailTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

      Events:
        SendEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/send
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer

        ListEmails:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/emails
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer

        GetEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref MailApi
            Path: /api/emails/{campaignId}
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer

  # ------------------------------------------------------------
  # CloudFront OAC
  # ------------------------------------------------------------

  MailOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: workverse-mail-oac
        Description: CloudFront access to private Workverse Mail S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------
  # CloudFront distribution
  # ------------------------------------------------------------

  MailDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt MailBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref MailOAC

          - Id: ApiOrigin
            DomainName: !Select
              - 2
              - !Split
                - /
                - !GetAtt MailApi.ApiEndpoint
            OriginPath: /prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - POST
              - PUT
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ------------------------------------------------------------
  # S3 bucket policy for CloudFront OAC
  # ------------------------------------------------------------

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MailBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MailDistribution}"

Outputs:
  FrontendBucket:
    Description: Private S3 bucket for frontend
    Value: !Ref MailBucket

  CloudFrontUrl:
    Description: HTTPS URL
    Value: !Sub "https://${MailDistribution.DomainName}"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref MailDistribution

  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !GetAtt MailApi.ApiEndpoint

  DynamoTable:
    Description: Dedicated DynamoDB table
    Value: !Ref MailTable

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref MailUserPool

  UserPoolClientId:
    Description: Cognito browser App Client ID
    Value: !Ref MailUserPoolClient

  CognitoIssuer:
    Description: Cognito JWT issuer
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${MailUserPool}"
