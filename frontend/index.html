<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workverse Mail</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><div class="logo">✉</div><div><b>Workverse Mail</b><span>Email Marketing</span></div></div><div class="user">SA</div></header>
<div class="layout"><aside><button class="nav active">✎ <span>Compose</span></button><button class="nav" id="sentNav">↗ <span>Sent Emails</span></button><div class="about">ⓘ <span>About</span></div></aside>
<main><section class="card compose"><h1>Send Email</h1><label>To</label><textarea id="recipients" placeholder="Enter email addresses separated by comma"></textarea><div class="recipient-actions"><button id="addEmail">＋ Add Email</button><span>or</span><label class="upload">↥ Upload CSV<input id="csv" type="file" accept=".csv,text/csv"></label></div><small>CSV format: one email per line</small><label>Subject</label><input id="subject" placeholder="Enter subject"><label>Body</label><textarea class="body" id="body" placeholder="Write your email here..."></textarea><div class="actions"><button class="preview" id="preview">◉ Send Preview</button><button class="send" id="send">➤ Send Email</button></div><p id="status"></p></section>
<section class="card history"><div class="history-head"><h2>Last Sent Emails</h2><button id="viewAll">View all →</button></div><div id="sentList"></div></section></main></div>
<div class="modal" id="modal"><div class="modal-box"><button class="close" id="close">×</button><h2>Email Preview</h2><div class="preview-meta"><b id="pSubject"></b><span id="pTo"></span></div><div id="pBody" class="preview-body"></div><button class="send" id="confirmSend">Send Email</button></div></div>
<div class="modal" id="detailModal"><div class="modal-box"><button class="close" id="detailClose">×</button><h2 id="detailSubject"></h2><div class="preview-meta"><span id="detailDate"></span><span id="detailRecipients"></span></div><div id="detailBody" class="preview-body"></div></div></div><script src="app.js"></script></body></html>
